services:
  arf-postgres:
    image: postgres:16-alpine
    container_name: arf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arf
      POSTGRES_USER: arf
      POSTGRES_PASSWORD: arf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - arf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arf -d arf"]
      interval: 10s
      timeout: 5s
      retries: 5

  arf-redis:
    image: redis:7-alpine
    container_name: arf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arf_postgres_data:
  arf_redis_data:

