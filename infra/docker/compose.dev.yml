services:
  cego-postgres:
    image: postgres:16-alpine
    container_name: cego-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cego
      POSTGRES_USER: cego
      POSTGRES_PASSWORD: cego_dev_password
    ports:
      - "${CEGO_POSTGRES_PORT:-15432}:5432"
    volumes:
      - cego_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cego -d cego"]
      interval: 10s
      timeout: 5s
      retries: 5

  cego-redis:
    image: redis:7-alpine
    container_name: cego-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cego_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cego_postgres_data:
  cego_redis_data:
